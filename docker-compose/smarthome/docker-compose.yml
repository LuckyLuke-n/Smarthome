services:

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/logs

  influxdb:
    image: influxdb:2
    container_name: influxdb-smarthome
    restart: always
    ports:
      - "8087:8086"
    volumes:
      - influxdb:/var/lib/influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin-password
      DOCKER_INFLUXDB_INIT_ORG: LOCAL
      DOCKER_INFLUXDB_INIT_BUCKET: Smarthome

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-smarthome
    restart: always
    ports:
     - '3001:3000'
    volumes:
      - grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin-password
 
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db

volumes:
  emqx_data:
  emqx_logs:
  grafana:
  influxdb:
  mongodb: