services:

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/logs

  influxdb:
    image: influxdb:2
    container_name: influxdb-smarthome
    restart: always
    ports:
      - "8087:8086"
    volumes:
      - influxdb:/var/lib/influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin-password
      DOCKER_INFLUXDB_INIT_ORG: LOCAL
      DOCKER_INFLUXDB_INIT_BUCKET: Smarthome

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-smarthome
    restart: always
    ports:
     - '3001:3000'
    volumes:
      - grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin-password
 
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel/config.yaml
    command: "--config /etc/otel/config.yaml"
    environment:
      - JAEGER_ENDPOINT=jaeger:4317
    ports:
      - "8889:8889"
      - "13133:13133"
      - "55679:55679"
      - "4317:4317" # OTLP endpoint for Jaeger
    depends_on:
      - jaeger
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # web ui

volumes:
  emqx_data:
  emqx_logs:
  grafana:
  influxdb:
  mongodb:
  prometheus:  