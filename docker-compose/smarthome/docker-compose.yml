services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    networks:
      - smarthome
    ports:
      - 5672:5672
      - 15672:15672
      - 1883:1883
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - rabbitmq:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=public

  influxdb:
    image: influxdb:2
    container_name: influxdb-smarthome
    restart: always
    ports:
      - "8087:8086"
    volumes:
      - influxdb:/var/lib/influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin-password
      DOCKER_INFLUXDB_INIT_ORG: LOCAL
      DOCKER_INFLUXDB_INIT_BUCKET: Smarthome

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-smarthome
    restart: always
    networks:
      - smarthome
    ports:
     - '3001:3000'
    volumes:
      - grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin-password
 
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=public
      - MONGO_INITDB_DATABASE=smarthome

networks:
  smarthome:
    driver: bridge  

volumes:
  rabbitmq:
  grafana:
  influxdb:
  mongodb: