name: Docker Build

on:
  pull_request:
    branches:
      - develop

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
  
    - name: Fetch tags
      run: git fetch --tags

    - name: Get latest tag
      id: get_latest_tag
      run: echo "latest_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/amd64,linux/arm64

    - name: Set up buildx
      uses: docker/setup-buildx-action@v4
      with:
        install: true
        buildkitd-flags: --debug

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
          context: .
          file: src-docker/Smarthome.AmbientCollector.Api/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: |
            luckyluke4411/ambientcollector:latest
            luckyluke4411/ambientcollector:${{ env.latest_tag }}
