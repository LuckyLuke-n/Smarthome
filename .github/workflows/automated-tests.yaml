name: Automated Tests

on:
  pull_request:
    branches:
      - develop

jobs:
  automated-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: linux/amd64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        install: true
        buildkitd-flags: --debug

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore

    - name: Run Smarthome.AmbientCollector.Integration Tests
      run: |
        dotnet test integration/Smarthome.AmbientCollector.Integration \
          --logger "trx;LogFileName=integration-test-results.trx" \
          --collect:"XPlat Code Coverage"
        
    - name: Run Smarthome.AmbientCollector.Test Tests
      run: |
        dotnet test test/Smarthome.AmbientCollector.Test \
          --logger "trx;LogFileName=unit-test-results.trx" \
          --collect:"XPlat Code Coverage"
