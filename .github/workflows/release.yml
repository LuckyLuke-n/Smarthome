name: automated tests and publish

on:
  push:
    branches: [ "master" ]

jobs:
  automated-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore

    - name: Run Smarthome.AmbientCollector.Integration Tests
      run: |
        dotnet test integration/Smarthome.AmbientCollector.Integration \
          --logger "trx;LogFileName=integration-test-results.trx" \
          --collect:"XPlat Code Coverage"
        
    - name: Run Smarthome.AmbientCollector.Test Tests
      run: |
        dotnet test test/Smarthome.AmbientCollector.Test \
          --logger "trx;LogFileName=unit-test-results.trx" \
          --collect:"XPlat Code Coverage"

  build and push:
    needs: automated-tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
  
    - name: Fetch tags
      run: git fetch --tags

    - name: Get latest tag
      id: get_latest_tag
      run: echo "latest_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/amd64,linux/arm64

    - name: Set up buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
          context: .
          file: src-docker/Smarthome.AmbientCollector.Api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            luckyluke4411/ambientcollector:latest
            luckyluke4411/ambientcollector:${{ env.latest_tag }}
