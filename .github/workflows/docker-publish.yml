name: Build and Push Docker image (multi-arch for Raspberry Pi)

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v4
        with:
          context: .src-docker/Smarthome.AmbientCollector.Api
          file: .src-docker/Smarthome.AmbientCollector.Api/Dockerfile
          push: true
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-repo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-repo:${{ github.sha }}

