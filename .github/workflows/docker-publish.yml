name: Build and Push Docker image (multi-arch for Raspberry Pi)

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get latest tag
        id: get_latest_tag
        run: |
          git fetch --tags
          echo "latest_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v4
        with:
          context: src-docker/Smarthome.AmbientCollector.Api
          file: src-docker/Smarthome.AmbientCollector.Api/Dockerfile
          push: true
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ambientcollector:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ambientcollector:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ambientcollector:${{ env.latest_tag }}

