name: Docker Image CI

on:
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
  
    - name: Fetch tags
      run: git fetch --tags

    - name: Get latest tag
      id: get_latest_tag
      run: echo "latest_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

    # - name: Build the Docker image
    #   run: docker build . --file src-docker/Smarthome.AmbientCollector.Api/Dockerfile --tag lucky-luke4411/ambientcollector:${{ env.latest_tag }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # - name: Push the Docker image
    #   run: docker push lucky-luke4411/ambientcollector:${{ env.latest_tag }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
          context: .
          file: src-docker/Smarthome.AmbientCollector.Api/Dockerfile
          push: true
          tags: |
            luckyluke4411/ambientcollector:latest
            luckyluke4411/ambientcollector:${{ env.latest_tag }}